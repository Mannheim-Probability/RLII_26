name: Course CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
      FORCE_COLOR: 1
    steps:
      - name: Check out repository without pretrained-agent submodule
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.9

      - name: Install the complete course environment
        run: uv sync --locked --all-extras

      - name: Check Python and lockfile
        run: |
          uv run --locked python --version
          uv lock --check

      - name: Check core imports
        run: >-
          uv run --locked python -c
          "import gymnasium, stable_baselines3, rl_zoo3, mujoco, pybullet, wandb;
          print('Imports OK')"

      - name: Check LunarLander, MuJoCo, and PyBullet environments
        run: |
          uv run --locked python -c "import gymnasium as gym; env = gym.make('LunarLander-v3'); env.reset(seed=0); env.close()"
          uv run --locked python -c "import gymnasium as gym; env = gym.make('HalfCheetah-v4'); env.reset(seed=0); env.close()"
          uv run --locked python -c "import gymnasium as gym; import rl_zoo3.import_envs; env = gym.make('HalfCheetahBulletEnv-v0'); env.reset(seed=0); env.close()"

      - name: Check ffmpeg
        run: ffmpeg -version

      - name: Run a short PPO LunarLander training
        run: >-
          uv run --locked python train.py
          --algo ppo
          --env LunarLander-v3
          --n-timesteps 512
          --seed 0
          --device cpu
          --eval-freq -1
          --log-folder /tmp/rl-zoo-smoke
          -params n_envs:1 n_steps:128 batch_size:64 n_epochs:1

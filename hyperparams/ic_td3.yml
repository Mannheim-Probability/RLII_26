# TD3 Zoo presets with a geometric target update schedule.
# The cycle length is measured in critic gradient steps.
default:
  <<: &target-schedule
    initial_target_update_interval: 2
    geometric_target_update_intervals: true
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  train_freq: 1
  gradient_steps: 1
  noise_type: 'normal'
  noise_std: 0.1

MountainCarContinuous-v0:
  <<: *target-schedule
  n_timesteps: 300000
  policy: 'MlpPolicy'
  noise_type: 'ornstein-uhlenbeck'
  noise_std: 0.5
  gradient_steps: 1
  train_freq: 1
  learning_rate: !!float 1e-3
  batch_size: 256
  policy_kwargs: "dict(net_arch=[400, 300])"

Pendulum-v1:
  <<: *target-schedule
  n_timesteps: 20000
  policy: 'MlpPolicy'
  gamma: 0.98
  buffer_size: 200000
  learning_starts: 10000
  noise_type: 'normal'
  noise_std: 0.1
  gradient_steps: 1
  train_freq: 1
  learning_rate: !!float 1e-3
  policy_kwargs: "dict(net_arch=[400, 300])"

